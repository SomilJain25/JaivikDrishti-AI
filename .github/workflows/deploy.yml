name: DrishtiScan CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DrishtiScan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: DrishtiScan/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov=app.predict \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short
        env:
          APP_ENV: testing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: DrishtiScan/coverage.xml
          fail_ci_if_error: false

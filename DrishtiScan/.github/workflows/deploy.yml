# =============================================================================
# DrishtiScan — GitHub Actions CI/CD Pipeline
# File: .github/workflows/deploy.yml
#
# Triggers:
#   push to main  → run tests → build Docker image → deploy to server
#   pull request  → run tests only (no deploy)
#
# Secrets to add in GitHub → Settings → Secrets:
#   DOCKER_USERNAME    your Docker Hub username
#   DOCKER_PASSWORD    your Docker Hub password / token
#   DEPLOY_HOST        your server IP or domain (e.g. 123.45.67.89)
#   DEPLOY_USER        SSH user on the server (e.g. ubuntu)
#   DEPLOY_SSH_KEY     your private SSH key (paste entire key)
#   SECRET_KEY         random secret for JWT signing
# =============================================================================

name: DrishtiScan CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# env:
#   IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/drishtiscan
#   IMAGE_TAG:  ${{ github.sha }}

jobs:
  # ── Job 1: Test ──────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DrishtiScan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: DrishtiScan/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov=app.predict \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short
        env:
          # No model needed for most unit tests; they mock the predictor
          APP_ENV: testing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false



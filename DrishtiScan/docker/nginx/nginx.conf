# =============================================================================
# DrishtiScan — nginx.conf
# Reverse proxy: routes all /api/* → FastAPI, serves frontend static files
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ─────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # ── Upload size (max leaf image = 10MB) ──────────────────────────────────
    client_max_body_size 15M;

    # ── Rate limiting zone (100 req/min per IP) ───────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # ── Upstream: FastAPI ─────────────────────────────────────────────────────
    upstream drishtiscan_api {
        server drishtiscan:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 200;
    }

    # ── Main HTTPS server ─────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name jaivikdrishti-ai.vercel.app;        # ← change to your domain

        # SSL certificates (use certbot / Let's Encrypt)
        # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         HIGH:!aNULL:!MD5;

        # ── Security headers ─────────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # ── API routes → FastAPI ─────────────────────────────────────────────
        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass         http://drishtiscan_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Longer timeout for ML inference
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ── Health check (no rate limit) ─────────────────────────────────────
        location = /health {
            proxy_pass http://drishtiscan_api/;
            access_log off;
        }
    }
}